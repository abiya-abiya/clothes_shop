<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clothes Shop</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- Navigatsiya menyusi (Navbar) -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <!-- Do'kon nomi -->
            <a class="navbar-brand fw-bold" href="{% url 'home' %}">Clothes Shop</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <!-- Asosiy sahifa -->
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'home' %}">Asosiy sahifa</a>
                    </li>
                    <!-- Mahsulotlar -->
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'product_list' %}">Mahsulotlar</a>
                    </li>
                </ul>

                <!-- Admin panel -->
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="btn btn-outline-light btn-sm" href="/admin/" target="_blank">Admin panel</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Asosiy mazmun qismi -->
    <main class="container my-4 flex-grow-1">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Pastki qism — Footer -->
    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <div class="container">
            <p class="mb-0">&copy; {% now "Y" %} Clothes Shop. Barcha huquqlar himoyalangan.</p>
        </div>
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
